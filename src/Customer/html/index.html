<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Customers</title>
</head>
<body>

    <div class="container">

        <header class="header">
          <h1>Kunden</h1>
          <button class="button-header" id="button-add" disabled="true">Hinzufügen</button>
          <button class="button-header" id="button-update" disabled="true">Update</button>
          <button class="button-header" id="button-clear" disabled="true">Zurücksetzen</button>
        </header>


        <div id="customer-table">
          <table>
            <thead>
              <tr>
                <th id="CustomerNr">Kunden Nr.</th>
                <th>Name</th>
                <th>Name2</th>
                <th>Straße</th>
                <th>PLZ</th>
                <th>Ort</th>
              </tr>
            </thead>
            <tbody>
              <!-- table body -->
            </tbody>
          </table>


        <hr class="blue-line">
        <div id="userMessage"></div>


        <div class="customer-details">
          <form>
            <div class="form-row flex">
              <label for="name">Name</label>
              <input type="text" id="name">
            </div>
           
            <div class="form-row flex">
              <label for="name2">Name2</label>
              <input type="text" id="name2">
            </div>

            <div class="form-row flex">
              <label for="street">Straße</label>
              <input type="text" id="street">
            </div>

            <div class="form-row">
                    <label id="city" for="city">Ort</label>
                    <input type="text" id="city">

                    <label id="zip" for="zip">ZIP</label>
                    <input type="number" id="zip">
            </div>

            <div class="form-row flex">
              <label for="country">Land</label>
              <input type="text" id="country">
            </div>

            <div class="form-row flex">
                <label for="mobile">Mobile</label>
                <input type="text" id="mobile" >
            </div>

            <div class="form-row flex">
                <label for="mail">Mail</label>
                <input type="text" id="mail" >
            </div>

            <div class="form-row flex">
                <label for="discount">Rabatt</label>
                <input type="number" id="discount" >
            </div>

            <div class="form-row flex">
                <label for="payment_terms">Zahlung</label>
                <select name="payment_terms" id="payment_terms" >
                  <option></option>
                  <option value="1">10 Tage 3%, 30 Tage ohne Abzug</option>
                  <option selected value="2">10 Tage ohne Abzug</option>
                  <option value="3">14 Tage 3%, 30 Tage ohne Abzug</option>
                  <option value="4">BAR</option>
                </select>
            </div>

          </form>
        </div>
    </div>
      <script type="module" src="../js/app.mjs"></script>
</body>
</html>
