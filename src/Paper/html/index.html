<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Paper</title>
</head>
<body>

    <div class="container">

        <header class="header">
          <h1>Papier</h1>
          <button class="button-header" id="button-add" disabled="true">Hinzufügen</button>
          <button class="button-header" id="button-update" disabled="true">Update</button>
          <button class="button-header" id="button-clear" disabled="true">Zurücksetzen</button>
        </header>


        <div id="paper-table">
          <table>
            <thead>
              <tr>
                <th id="PaperId">Paper Id</th>
                <th>Papierart</th>
                <th>Marke</th>
                <th>Grammatur</th>
                <th>Format</th>
                <th>Volumen</th>
              </tr>
            </thead>
            <tbody>
              <!-- table body -->
            </tbody>
          </table>


        <hr class="blue-line">
        <div id="userMessage"></div>


        <div class="paper-details">
          <form>

            <div class="form-row flex">
              <label for="papierart">Papierart</label>
              <input type="text" id="papierart">
            </div>

            <div class="form-row flex">
              <label for="marke">Marke</label>
              <input type="text" id="marke">
            </div>
           
            <div class="form-row flex">
              <label for="ek">Preis EK</label>     
              <input type="number" id="ek">
            </div>

            <div class="form-row flex">
              <label for="vk">Preis VK</label>    
              <input type="number" id="vk">
              <label id="ekAufschlag">...% Aufschlag</label>
            </div>
            
            <div class="form-row flex">
              <label for="lagerbestand">Lagerbestand</label>
              <input type="number" id="lagerbestand">
              <button id="btnLagerbestand" type="button">Wareneingang</button>
            </div>


            <hr class="blue-line">


            <div class="form-row">
              <label for="format">Format</label>
              <div class="format">
                <input type="number" id="length"> X
                <input type="number" id="width">
              </div>
            </div>

            <div class="form-row">
              <label for="grammatur">Grammatur Text</label>
              <input type="number" id="grammatur">
              <label>g/m²</label>
            </div>

            <div class="form-row">
              <label for="volumen">Volumen</label>
              <input type="number" id="volumen">
            </div>

            <div class="form-row flex">
              <label for="preis">Preis</label>
              <input type="number" id="preis">
              <label for="preis">pro</label>
              <input type="number" id="preisProKg">
              <label for="preis">kg</label>
            </div>

            <div class="form-row flex">
              <label for="Bogenpreis">Bogenpreis</label>
              <input type="number" id="bogenpreis" disabled>
            </div>

            <div class="form-row flex">
              <label for="stapelhöhe">Stapelhöhe</label>
              <input type="number" id="stapelhöhe">
              <label for="stapelhöhe">mm</label>
              <input type="number" id="bogen" disabled>
              <label for="stapelhöhe">Bg.</label>
            </div>

          </form>
        </div>

    <div id="popup"style="display: none; position: fixed; top: 30%; left: 50%; transform: translate(-50%, -30%); padding: 20px; background-color: white; border: 1px solid #ccc; box-shadow: 0 0 10px rgba(0,0,0,0.3); z-index: 1000;">
      <label for="inputText">Gib etwas ein:</label>
      <input type="number" id="storageInput">
      <button id="closePopup" type="button">Abbrechen</button>
      <button id="okPopup" type="button">Ok</button>
    </div>
    </div>
      <script type="module" src="../js/app.mjs"></script>
</body>
</html>
